name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate GitHub stats
        run: |
          curl -o profile/stats.svg \
          "https://github-readme-stats.vercel.app/api?username=Desertelk&show_icons=true&theme=github_dark"

      - name: Generate top languages
        run: |
          curl -o profile/top-languages.svg \
          "https://github-readme-stats.vercel.app/api/top-langs/?username=Desertelk&layout=compact&theme=github_dark"

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || git commit -m "Update GitHub statistics"
          git push
